<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katydidion</title>
<meta name="description" content="Name the bug nobody else would. 7 prompts, rarer answers score more.">
<meta property="og:title" content="Katydidion 🦗">
<meta property="og:description" content="Name the bug nobody else would.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦗</text></svg>">
<style>
  :root {
    --bg: #f4f1e6;
    --fg: #1f2a1c;
    --muted: #6b735f;
    --line: #c9c4ae;
    --accent: #3f7d2c;
    --bad: #a23b2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a12;
      --fg: #e8ead9;
      --muted: #9aa38c;
      --line: #36412f;
      --accent: #8fd16a;
      --bad: #e0806b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.45 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 520px; padding: 28px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.5px; }
  h1 span { font-size: 24px; }
  .gameno { color: var(--muted); font-variant-numeric: tabular-nums; }
  .progress { display: flex; gap: 6px; margin-bottom: 22px; font-size: 22px; min-height: 30px; }
  .progress .slot { width: 30px; text-align: center; border-bottom: 2px solid var(--line); }
  .progress .slot.cur { border-color: var(--accent); }
  .qnum { color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
  .prompt { font-size: 26px; font-weight: 700; margin: 6px 0 20px; line-height: 1.2; }
  form { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; min-width: 0;
    font: inherit; font-size: 19px;
    color: var(--fg); background: transparent;
    border: 2px solid var(--line); border-radius: 10px;
    padding: 12px 14px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    font: inherit; font-weight: 700;
    color: var(--accent); background: transparent;
    border: 2px solid var(--accent); border-radius: 10px;
    padding: 12px 18px; cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  button.ghost { color: var(--muted); border-color: var(--line); }
  .result { margin-top: 22px; min-height: 120px; }
  .hit { display: flex; align-items: center; gap: 14px; }
  .hit .emo { font-size: 44px; }
  .hit .pts { font-size: 30px; font-weight: 800; }
  .hit .lbl { color: var(--muted); }
  .miss .pts { color: var(--bad); }
  .rarest { margin-top: 12px; color: var(--muted); font-size: 15px; }
  .rarest b { color: var(--fg); }
  .actions { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; }
  .score { font-size: 64px; font-weight: 800; margin: 4px 0 0; font-variant-numeric: tabular-nums; }
  .outof { color: var(--muted); margin-bottom: 14px; }
  .row { font-size: 34px; letter-spacing: 2px; margin-bottom: 20px; }
  .rank { font-size: 20px; font-weight: 700; margin-bottom: 18px; }
  ol.recap { padding: 0; margin: 0 0 22px; list-style: none; border-top: 1px solid var(--line); }
  ol.recap li { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  ol.recap .e { font-size: 20px; }
  ol.recap .q { color: var(--muted); }
  ol.recap .a { font-weight: 700; }
  ol.recap .p { margin-left: auto; font-variant-numeric: tabular-nums; }
  pre.share {
    font: inherit; white-space: pre-wrap;
    border: 1px dashed var(--line); border-radius: 10px;
    padding: 12px 14px; margin: 0 0 12px;
  }
  .toast { color: var(--accent); font-size: 14px; min-height: 20px; }
  .legend { margin-top: 36px; color: var(--muted); font-size: 14px; }
  .legend div { display: flex; gap: 10px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Katydidion <span>🦗</span></h1>
    <div class="gameno" id="gameno"></div>
  </header>

  <section id="play">
    <div class="progress" id="progress"></div>
    <div class="qnum" id="qnum"></div>
    <div class="prompt" id="prompt"></div>
    <form id="form" autocomplete="off">
      <input type="text" id="answer" placeholder="Your answer" autocapitalize="off" spellcheck="false" enterkeyhint="go">
      <button type="submit" id="submit">Go</button>
    </form>
    <div class="result" id="result"></div>
  </section>

  <section id="done" class="hidden">
    <div class="qnum">Final score</div>
    <div class="score" id="final"></div>
    <div class="outof">out of 700</div>
    <div class="row" id="row"></div>
    <div class="rank" id="rank"></div>
    <ol class="recap" id="recap"></ol>
    <pre class="share" id="sharetext"></pre>
    <div class="actions">
      <button id="share">Share</button>
      <button id="copy" class="ghost">Copy</button>
      <button id="again" class="ghost">New game</button>
    </div>
    <div class="toast" id="toast"></div>
  </section>

  <div class="legend" id="legend"></div>
</main>

// --- matching ---
function norm(s) {
  s = s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/['’]/g, "").replace(/[^a-z0-9]+/g, " ").trim()
    .replace(/^(the|a|an) /, "");
  s = s.replace(/ies$/, "y").replace(/([^s])s$/, "$1");
  return s.replace(/ /g, "");
}
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const t = d[j];
      d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = t;
    }
  }
  return d[b.length];
}
function buildIndex(p) {
  const out = [];
  for (let t = 0; t < 6; t++) {
    for (const entry of p[t + 1].split("|")) {
      const names = entry.split("/");
      for (const n of names) {
        out.push({ key: norm(n), display: names[0], pts: PTS[t] });
        // let "dracula" match "dracula ant", "stag" match "stag beetle", etc.
        const short = n.match(/^(.{4,}) (ant|beetle|moth|fly|bee|wasp|spider|bug|butterfly|cricket)$/);
        if (short) out.push({ key: norm(short[1]), display: names[0], pts: PTS[t] });
      }
    }
  }
  return out;
}
function score(p, raw) {
  const k = norm(raw);
  if (!k) return { pts: 0, display: null };
  const idx = buildIndex(p);
  const exact = idx.filter(e => e.key === k);
  if (exact.length) return exact.reduce((a, b) => (b.pts > a.pts ? b : a));
  let best = null, bestD = 99;
  for (const e of idx) {
    const tol = e.key.length >= 9 ? 2 : e.key.length >= 5 ? 1 : 0;
    const d = lev(k, e.key);
    if (d <= tol && (d < bestD || (d === bestD && e.pts > best.pts))) { best = e; bestD = d; }
  }
  return best || { pts: 0, display: null };
}

// --- seeded game selection ---
function rng(seed) {
  return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
}
function pick(seed) {
  const r = rng(seed * 7919 + 17);
  const order = PROMPTS.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  return order.slice(0, 7);
}

// --- state ---
const $ = id => document.getElementById(id);
let seed, game, i, results, locked;

function newGame(s) {
  seed = s || Math.floor(Math.random() * 9000) + 1;
  history.replaceState(null, "", "?g=" + seed);
  game = pick(seed); i = 0; results = []; locked = false;
  $("gameno").textContent = "#" + seed;
  $("play").classList.remove("hidden");
  $("done").classList.add("hidden");
  renderQ();
}

function renderProgress() {
  $("progress").innerHTML = game.map((_, k) =>
    `<div class="slot${k === i && results.length === i ? " cur" : ""}">${results[k] ? EMO[results[k].pts] : ""}</div>`).join("");
}

function renderQ() {
  const p = PROMPTS[game[i]];
  $("qnum").textContent = `Prompt ${i + 1} of 7`;
  $("prompt").textContent = p[0];
  $("answer").value = ""; $("answer").disabled = false; $("submit").disabled = false;
  $("result").innerHTML = "";
  locked = false;
  renderProgress();
  $("answer").focus();
}

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

$("form").addEventListener("submit", e => {
  e.preventDefault();
  if (locked) { next(); return; }
  const raw = $("answer").value.trim();
  if (!raw) return;
  locked = true;
  const p = PROMPTS[game[i]];
  const r = score(p, raw);
  results.push({ q: p[0], a: raw, pts: r.pts });
  $("answer").disabled = true;
  const rarest = p[6];
  const isRarest = r.pts === 100;
  $("result").innerHTML = `
    <div class="hit ${r.pts ? "" : "miss"}">
      <div class="emo">${EMO[r.pts]}</div>
      <div><div class="pts">${r.pts ? "+" + r.pts : "0"}</div><div class="lbl">${LBL[r.pts]}</div></div>
    </div>
    ${isRarest ? "" : `<div class="rarest">Rarest answer: <b>${esc(rarest)}</b></div>`}
    <div class="actions"><button type="button" id="nextbtn">${i === 6 ? "See results" : "Next →"}</button></div>`;
  $("nextbtn").onclick = next;
  $("submit").disabled = true;
  renderProgress();
  $("nextbtn").focus();
});

function next() {
  i++;
  if (i < 7) renderQ(); else finish();
}

function rankFor(t) {
  if (t >= 600) return "🦗 Certified Katydid";
  if (t >= 450) return "🪲 Deep Leaf Litter";
  if (t >= 300) return "🐝 Respectable Swarm";
  if (t >= 150) return "🐞 Garden Variety";
  return "🐜 Picnic Ant";
}

function shareText() {
  const total = results.reduce((a, r) => a + r.pts, 0);
  return `Katydidion #${seed} 🦗\n${total}\n${results.map(r => EMO[r.pts]).join("")}\n${location.origin + location.pathname}?g=${seed}`;
}

function finish() {
  const total = results.reduce((a, r) => a + r.pts, 0);
  $("play").classList.add("hidden");
  $("done").classList.remove("hidden");
  $("final").textContent = total;
  $("row").textContent = results.map(r => EMO[r.pts]).join("");
  $("rank").textContent = rankFor(total);
  $("recap").innerHTML = results.map(r =>
    `<li><span class="e">${EMO[r.pts]}</span><span><span class="q">${esc(r.q)}</span><br><span class="a">${esc(r.a)}</span></span><span class="p">${r.pts}</span></li>`).join("");
  $("sharetext").textContent = shareText();
  $("share").classList.toggle("hidden", !navigator.share);
}

function toast(m) { $("toast").textContent = m; setTimeout(() => $("toast").textContent = "", 2000); }
async function copy() {
  try { await navigator.clipboard.writeText(shareText()); toast("Copied. Go flex."); }
  catch { toast("Couldn't copy, select the text above"); }
}
$("copy").onclick = copy;
$("share").onclick = async () => { try { await navigator.share({ text: shareText() }); } catch {} };
$("again").onclick = () => newGame();

$("legend").innerHTML = [0, ...PTS].map(p => `<div><span>${EMO[p]}</span><span>${p} · ${LBL[p]}</span></div>`).join("");

const g = parseInt(new URLSearchParams(location.search).get("g"), 10);
newGame(g > 0 ? g : null);
</script>
</body>
</html>
